name: Python geometry checks
on:
  push:
  pull_request:
jobs:
  non-gui-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies for geometry checks
        run: python -m pip install numpy matplotlib
      - name: Compile Python files
        run: python -m compileall -q motion_planning foundations tests
      - name: Run numerical checks
        run: python -m unittest discover -s tests -v
